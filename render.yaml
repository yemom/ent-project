services:
  # ── Spring Boot backend ─────────────────────────────────────────────
  - type: web
    name: ent-project-backend
    runtime: docker
    dockerfilePath: ./clinic/backend/Dockerfile
    dockerContext: ./clinic/backend
    plan: free
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Super Admin bootstrap. The account is looked up by email first, then by
      # name. Set these to Esrom Basazinaw's real mailbox and a strong password
      # before the first deploy; the account is created on boot, or promoted if it
      # already exists under an older role. A password that fails the policy is
      # refused rather than replaced with a default.
      # The legacy ADMIN_NAME / ADMIN_EMAIL / ADMIN_PASSWORD names still work.
      - key: SUPER_ADMIN_NAME
        sync: false
      - key: SUPER_ADMIN_EMAIL
        sync: false
      - key: SUPER_ADMIN_PASSWORD
        sync: false
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: validate
      - key: SPRING_FLYWAY_ENABLED
        value: "true"
      # flyway.repair() costs two extra statements per boot; disable in prod.
      - key: SPRING_FLYWAY_REPAIR_ON_STARTUP
        value: "false"
      - key: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
        value: "10"
      - key: SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE
        value: "1"
      - key: SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT
        value: "10000"
      - key: APP_JWT_SECRET
        sync: false
      # Short-lived access token; refreshed through rotation.
      - key: APP_JWT_EXPIRATION_MILLIS
        value: "900000"
      - key: APP_JWT_REFRESH_EXPIRATION_MILLIS
        value: "604800000"
      - key: APP_JWT_ISSUER
        value: clinic
      # Refunds above this amount need a second privileged approver.
      - key: APP_REFUND_APPROVAL_THRESHOLD
        value: "500.00"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://yemom-hospital.vercel.app,http://localhost:3001"
      - key: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
        value: health,info
      - key: MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED
        value: "true"
      # AI chat is opt-in. Keep the provider credential server-side; it is never
      # exposed to the frontend or returned by the capabilities endpoint.
      - key: AI_ENABLED
        value: "true"
      - key: AI_PROVIDER
        value: openai-compatible
      - key: AI_API_URL
        sync: false
      - key: AI_MODEL
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_REQUEST_TIMEOUT_MS
        value: "20000"
      - key: AI_MAX_OUTPUT_TOKENS
        value: "700"
      - key: AI_ALLOW_IDENTIFIABLE_DATA
        value: "false"
      - key: AI_ALLOWED_HOSTS
        value: api.openai.com
    # DB-free liveness endpoint: answers as soon as the HTTP listener is up,
    # which is what the keep-alive ping and the frontend wake-up call rely on.
    healthCheckPath: /api/v1/health