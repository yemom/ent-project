spring:
  application:
    name: clinic
  config:
    # Local development overrides, loaded from `.env.local` (git-ignored).
    #
    # This exists because `mvn spring-boot:run` and IDE runs receive NO environment
    # variables: the app then boots against the empty in-memory H2 database with no
    # SUPER_ADMIN_EMAIL, creates a `super.admin@clinic.local` account with a random
    # password, and sign-in as the real owner fails with a bare 401. Putting the
    # Super Admin identity in `.env.local` makes local runs behave predictably.
    #
    # Deliberately NOT `.env`: that file holds the production datasource and profile,
    # and importing it here would silently redirect every local run at production
    # Postgres. Production values are injected by Render's environment, not a file.
    #
    # `optional:` so an environment with no `.env.local` still starts.
    import: "optional:file:.env.local[.properties]"
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  main:
    banner-mode: off
  lifecycle:
    # Start serving HTTP before the JPA/Flyway work finishes so the liveness probe
    # can answer during a Render cold start. Flyway still runs before the app is
    # marked ready, so this only helps the "is the listener up" question.
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/clinic_db}}
    username: ${SPRING_DATASOURCE_USERNAME:clinic_user}
    password: ${SPRING_DATASOURCE_PASSWORD:clinic_secure_password_change_me}
    hikari:
      pool-name: ClinicHikariPool
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:10}
      minimum-idle: ${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:1}
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: ${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:10000}
      validation-timeout: 3000
      # Do not block startup on the first connection; fail fast per-request instead.
      initialization-fail-timeout: 1
      connection-test-query: SELECT 1
  jpa:
    open-in-view: false
    defer-datasource-initialization: false
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    properties:
      hibernate:
        format_sql: false
        default_batch_fetch_size: 50
        order_inserts: true
        order_updates: true
        generate_statistics: false
        jdbc:
          time_zone: UTC
          batch_size: 50
  flyway:
    enabled: true
    baseline-on-migrate: true
    connect-retries: 5
    connect-retries-interval: 3
  jackson:
    serialization:
      write-dates-as-timestamps: false
  mvc:
    problemdetails:
      enabled: true
  cache:
    type: ${SPRING_CACHE_TYPE:simple}
    redis:
      time-to-live: 10m
      cache-null-values: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
      connect-timeout: 2s
      repositories:
        enabled: false

server:
  port: ${PORT:10000}
  address: ${SERVER_ADDRESS:0.0.0.0}
  shutdown: graceful
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain,text/css,text/javascript,application/javascript
    min-response-size: 1024
  tomcat:
    threads:
      max: ${SERVER_TOMCAT_MAX_THREADS:60}
      min-spare: 8
    max-connections: 2000
    accept-count: 100
    connection-timeout: 20s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,caches,threaddump
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
      # The liveness probe must not depend on DB/Redis.
      group:
        liveness:
          include: livenessState
  health:
    redis:
      enabled: ${SPRING_REDIS_HEALTH_ENABLED:false}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    com.clinic: ${LOG_LEVEL_CLINIC:INFO}
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN

app:
  jwt:
    secret: ${APP_JWT_SECRET:c2VjdXJlLWp3dC1zZWNyZXQta2V5LWZvci1jbGluaWNlbC1zdXJwYXNzLW1lLTMya2V5cwo=}
    # Short-lived access token; the frontend refreshes through rotation.
    expiration-millis: ${APP_JWT_EXPIRATION_MILLIS:900000}
    refresh-expiration-millis: ${APP_JWT_REFRESH_EXPIRATION_MILLIS:604800000}
    issuer: ${APP_JWT_ISSUER:clinic}
  security:
    # Refunds above this amount need approval from a second privileged user.
    refund-approval-threshold: ${APP_REFUND_APPROVAL_THRESHOLD:500.00}
  # Outbound email. With MAIL_HOST unset the deployment cannot send mail, and the
  # password-reset endpoints answer 503 rather than pretending a message was sent.
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    from: ${MAIL_FROM:no-reply@clinic.local}
    start-tls: ${MAIL_START_TLS:true}
    ssl-enable: ${MAIL_SSL_ENABLE:false}
    connection-timeout-seconds: ${MAIL_CONNECTION_TIMEOUT_SECONDS:10}
    timeout-seconds: ${MAIL_TIMEOUT_SECONDS:10}
    write-timeout-seconds: ${MAIL_WRITE_TIMEOUT_SECONDS:10}
  password-reset:
    # Short on purpose. The token travels through a recipient's inbox, where a link
    # can sit unread for days; a long window turns an old mail into a live key.
    token-ttl-minutes: ${PASSWORD_RESET_TOKEN_TTL_MINUTES:30}
    max-issuances-per-window: ${PASSWORD_RESET_MAX_ISSUANCES:3}
    issuance-window-minutes: ${PASSWORD_RESET_ISSUANCE_WINDOW_MINUTES:60}
    # Where the emailed link points. Must be the public frontend origin: a link to
    # localhost is a support ticket waiting to happen.
    frontend-reset-url: ${PASSWORD_RESET_FRONTEND_URL:http://localhost:3001/reset-password}
  clinic-name: ${CLINIC_NAME:Clinic Care}

# AI assistant.
#
# Disabled unless AI_ENABLED is set, and usable only once the selected provider's
# endpoint and model are set. Hosted providers also require AI_API_KEY; local
# Ollama does not. Local Ollama keeps identifiable clinical context on the host.
#
# AI_ALLOW_IDENTIFIABLE_DATA defaults to false and must be turned on explicitly
# before any capability that carries patient-identifiable clinical text will run.
# Everything else — counts, dates, categories, status breakdowns — works with it off.
ai:
  enabled: ${AI_ENABLED:false}
  provider: ${AI_PROVIDER:local-ollama}
  api-url: ${AI_API_URL:http://localhost:11434}
  model: ${AI_MODEL:llama3.2}
  # Server-side only. Never a NEXT_PUBLIC_* variable, never returned by an endpoint.
  api-key: ${AI_API_KEY:}
  request-timeout-millis: ${AI_REQUEST_TIMEOUT_MS:20000}
  max-output-tokens: ${AI_MAX_OUTPUT_TOKENS:700}
  max-input-chars: ${AI_MAX_INPUT_CHARS:4000}
  max-history-turns: ${AI_MAX_HISTORY_TURNS:8}
  requests-per-window: ${AI_REQUESTS_PER_WINDOW:30}
  requests-window-minutes: ${AI_REQUESTS_WINDOW_MINUTES:10}
  allow-identifiable-data: ${AI_ALLOW_IDENTIFIABLE_DATA:false}
  # Optional. Empty means "trust the configured AI_API_URL host"; populating it adds
  # a second gate for deployments under a data-residency or vendor policy.
  allowed-hosts: ${AI_ALLOWED_HOSTS:}
  rate-limit:
    # Overridable so the scripted test suites can turn it off: they fire several
    # hundred requests within a couple of minutes against one account, which a
    # limiter tuned for human traffic correctly rejects with 429. The protection
    # belongs in production, not in a scripted run.
    enabled: ${APP_RATE_LIMIT_ENABLED:true}
    requests: ${RATE_LIMIT_REQUESTS:120}
    auth-requests: ${RATE_LIMIT_AUTH_REQUESTS:20}
    window: ${RATE_LIMIT_WINDOW:1m}
    protected-path-prefixes:
      - /api