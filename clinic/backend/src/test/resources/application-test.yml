spring:
  docker:
    compose:
      enabled: false

  datasource:
    url: jdbc:h2:mem:clinice_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false
    open-in-view: false
  flyway:
    enabled: false
  cache:
    type: simple

app:
  jwt:
    secret: c2VjcmV0LWZvci1kZXYtYW5kLXRlc3RzLW9ubHktY2xpbmljZWwtc2VjcmV0LWtleS02NC1ieXRlcy1taW4tZm9yLWhzNTEyIQ==
    expiration-millis: 3600000
    issuer: clinic-Test
  rate-limit:
    enabled: false

logging:
  level:
    root: INFO
    com.clinic: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
