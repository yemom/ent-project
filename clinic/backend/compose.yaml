services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: clinic_user
      POSTGRES_PASSWORD: clinic_secure_password_change_me
      POSTGRES_DB: clinic_db
    ports:
      - "5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U clinic_user -d clinic_db" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  redis:
    image: redis:7-alpine
    ports:
      - "6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 2s
