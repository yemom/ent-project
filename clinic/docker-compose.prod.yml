services:
  nginx:
    image: nginx:alpine
    container_name: clinic-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend_1
      - frontend_2
      - backend_1
      - backend_2
    networks:
      - clinic_network

  frontend_1:
    image: ${FRONTEND_IMAGE:?set FRONTEND_IMAGE}
    container_name: clinic-frontend-1
    restart: unless-stopped
    # NEXT_PUBLIC_* values are compiled into the image. Build it with
    # NEXT_PUBLIC_API_BASE_URL=/api/v1 so browsers use the Nginx same-origin route.
    expose:
      - "3000"
    networks:
      - clinic_network

  frontend_2:
    image: ${FRONTEND_IMAGE:?set FRONTEND_IMAGE}
    container_name: clinic-frontend-2
    restart: unless-stopped
    # Keep both replicas on the same frontend image/configuration.
    expose:
      - "3000"
    networks:
      - clinic_network

  backend_1:
    image: ${BACKEND_IMAGE:?set BACKEND_IMAGE}
    container_name: clinic-backend-1
    restart: unless-stopped
    environment: &backend_environment
      SPRING_PROFILES_ACTIVE: prod
      PORT: 8080

      # Local Docker PostgreSQL
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-clinic_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-clinic_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}

      # JPA / Flyway
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_FLYWAY_ENABLED: "true"

      # JWT
      APP_JWT_SECRET: ${APP_JWT_SECRET:?set APP_JWT_SECRET}
      APP_JWT_EXPIRATION_MILLIS: ${APP_JWT_EXPIRATION_MILLIS:-86400000}
      APP_JWT_ISSUER: ${APP_JWT_ISSUER:-clinic}

      # CORS
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}

      # Super Admin bootstrap.
      #
      # Required rather than optional on purpose. Without SUPER_ADMIN_PASSWORD the
      # initializer generates a random password, logs that it did, and produces a
      # deployment nobody can sign into — and a container is restarted from scratch,
      # so there is no second chance to read it out of a log. Failing loudly at boot
      # is the better outcome.
      SUPER_ADMIN_NAME: ${SUPER_ADMIN_NAME:?set SUPER_ADMIN_NAME}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:?set SUPER_ADMIN_EMAIL}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:?set SUPER_ADMIN_PASSWORD}

      # Actuator
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:-health,info}
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: ${MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED:-true}

    expose:
      - "8080"

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health/readiness > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 90s

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - clinic_network

  backend_2:
    image: ${BACKEND_IMAGE:?set BACKEND_IMAGE}
    container_name: clinic-backend-2
    restart: unless-stopped
    environment:
      <<: *backend_environment

    expose:
      - "8080"

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health/readiness > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 90s

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - clinic_network

  postgres:
    image: postgres:16-alpine
    container_name: clinic-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clinic_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-clinic_db}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    expose:
      - "5432"

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clinic_user} -d ${POSTGRES_DB:-clinic_db}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - clinic_network

volumes:
  postgres_data:
    driver: local

networks:
  clinic_network:
    driver: bridge
